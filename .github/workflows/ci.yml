name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t who-changed-it:ci .
      - name: Smoke test container
        run: |
          docker run -d --name wci -p 8000:8000 who-changed-it:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -F before_file=@examples/merchant-before.json \
                    -F after_file=@examples/merchant-after.json \
                    http://127.0.0.1:8000/api/compare | grep -q '"total": 7'
          docker logs wci
          docker rm -f wci
